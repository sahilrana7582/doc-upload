spring:
  application:
    name: doc-upload

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 600MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080

app:
  aws:
    region: ${AWS_REGION:ap-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:doc-upload-storage-prod}
      key-prefix: uploads/
